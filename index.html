<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2ea">
  <title>Recipe Pocket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="update-banner hidden" id="updateBanner">
      <span>Update available</span>
      <button class="text-button primary" id="reloadUpdateButton">Restart</button>
    </div>
    <div class="backup-banner hidden" id="backupBanner">
      <span>Backup reminder</span>
      <button class="text-button primary" id="backupNowButton">Backup</button>
    </div>
    <div class="toast hidden" id="toastMessage" role="status" aria-live="polite"></div>

    <header class="topbar">
      <div>
        <p class="eyebrow">Recipe Pocket</p>
        <h1 id="screenTitle">Recipes</h1>
      </div>
      <button class="icon-button primary" id="addRecipeButton" aria-label="Add recipe" title="Add recipe">+</button>
    </header>

    <main>
      <section class="screen active" id="recipesScreen" aria-labelledby="screenTitle">
        <p class="screen-count" id="recipeCount"></p>
        <div class="search-row">
          <input id="recipeSearch" type="search" placeholder="Search recipes, tags, ingredients">
          <button class="icon-button" id="favoritesFilter" aria-label="Show favorites" title="Favorites">*</button>
        </div>
        <div class="chip-row" id="tagFilters"></div>
        <div class="recipe-list" id="recipeList"></div>
      </section>

      <section class="screen" id="pantryScreen" aria-label="Pantry">
        <div class="pantry-entry">
          <input id="pantryInput" placeholder="Ingredient at home">
          <button class="icon-button primary" id="addPantryButton" aria-label="Add ingredient">+</button>
        </div>
        <div class="chip-row" id="pantryChips"></div>
        <h2>Can make</h2>
        <div class="recipe-list compact" id="pantryMatches"></div>
      </section>

      <section class="screen" id="mealPlannerScreen" aria-label="Mealplanner">
        <div class="meal-plan-list" id="mealPlanList"></div>
        <section class="shopping-panel" aria-label="Shopping list">
          <div class="section-head">
            <h2>Shopping list</h2>
            <div class="shopping-actions">
              <select id="shoppingSortSelect" aria-label="Sort shopping list">
                <option value="recipe">By recipe</option>
                <option value="category">By category</option>
              </select>
              <button class="text-button" id="copyShoppingButton" type="button">Copy</button>
              <button class="text-button" id="clearShoppingButton" type="button">Clear</button>
            </div>
          </div>
          <div class="shopping-list" id="mealShoppingList"></div>
        </section>
      </section>

      <section class="screen" id="settingsScreen" aria-label="Settings">
        <div class="settings-grid">
          <div class="settings-action app-version-card">
            <span>Recipe Pocket <strong id="appVersionLabel"></strong></span>
            <small id="appVersionNotes"></small>
          </div>
          <button class="settings-action" id="exportButton">
            <span>Export backup</span>
            <small>Save recipes as JSON</small>
          </button>
          <label class="settings-action setting-field">
            <span>Backup reminder</span>
            <small id="backupStatusText"></small>
            <input id="backupReminderDaysInput" type="number" min="1" max="365" inputmode="numeric">
          </label>
          <label class="settings-action file-action">
            <span>Import recipe collection</span>
            <small>Load Recipe Pocket backup or Recipe Manager collection</small>
            <input id="importFile" type="file" accept=".json,.zip,application/json,application/zip">
          </label>
          <button class="settings-action" id="importCodeButton">
            <span>Import single recipe</span>
            <small>Paste an RM1 code from Recipe Manager</small>
          </button>
          <label class="settings-action setting-field">
            <span>Mealplanner servings</span>
            <small>Default when planning a recipe</small>
            <input id="defaultMealServingsInput" type="number" min="1" max="99" inputmode="numeric">
          </label>
          <label class="settings-action setting-field">
            <span>Shopping list sort</span>
            <small>Default Mealplanner shopping order</small>
            <select id="defaultShoppingSortSelect">
              <option value="recipe">By recipe</option>
              <option value="category">By category</option>
            </select>
          </label>
          <button class="settings-action danger" id="resetButton">
            <span>Reset samples</span>
            <small>Replace local data</small>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main">
      <button class="nav-item active" data-screen="recipesScreen" data-title="Recipes">Recipes</button>
      <button class="nav-item" data-screen="pantryScreen" data-title="Pantry">Pantry</button>
      <button class="nav-item" data-screen="mealPlannerScreen" data-title="Mealplanner">Mealplanner</button>
      <button class="nav-item" data-screen="settingsScreen" data-title="Settings" aria-label="Settings" title="Settings">Settings</button>
    </nav>
  </div>

  <dialog id="recipeDialog">
    <form method="dialog" class="editor" id="recipeForm">
      <div class="dialog-head">
        <h2 id="dialogTitle">Recipe</h2>
        <button type="button" class="icon-button" id="closeRecipeDialogButton" aria-label="Close">x</button>
      </div>

      <input type="hidden" id="recipeId">
      <label>Title<input id="titleInput" required></label>
      <div class="split">
        <label>Cuisine<input id="cuisineInput"></label>
        <label>Minutes<input id="minutesInput" type="number" min="0" inputmode="numeric"></label>
      </div>
      <div class="split">
        <label>Servings<input id="servingsInput" type="number" min="1" inputmode="numeric"></label>
        <label>Tags<input id="tagsInput" placeholder="vegan, quick"></label>
      </div>
      <label>Ingredients<textarea id="ingredientsInput" rows="6" placeholder="1 cup rice&#10;2 tomato"></textarea></label>
      <label>Tools<textarea id="toolsInput" rows="3" placeholder="Pan&#10;Knife"></textarea></label>
      <label>Instructions<textarea id="instructionsInput" rows="7"></textarea></label>
      <label>Source URL<input id="sourceInput" type="url" inputmode="url"></label>
      <div class="toggle-line">
        <label class="check-label"><input id="favoriteInput" type="checkbox"> Favorite</label>
        <button type="button" class="text-button danger hidden" id="deleteRecipeButton">Delete</button>
      </div>
      <menu>
        <button type="button" class="text-button" id="cancelRecipeButton">Cancel</button>
        <button class="text-button primary" id="saveRecipeButton" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="detailDialog" class="detail-dialog">
    <article class="detail-view">
      <div class="detail-body">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="detailMeta"></p>
            <h2 id="detailTitle"></h2>
          </div>
          <button class="icon-button" id="closeDetailButton" aria-label="Close">x</button>
        </div>
        <div class="serving-stepper">
          <button class="icon-button" id="servingMinus" aria-label="Reduce servings">-</button>
          <span id="servingLabel"></span>
          <button class="icon-button" id="servingPlus" aria-label="Increase servings">+</button>
        </div>
        <h3>Ingredients</h3>
        <ul id="detailIngredients"></ul>
        <h3>Tools</h3>
        <ul id="detailTools"></ul>
        <h3>Instructions</h3>
        <p id="detailInstructions"></p>
        <a id="detailSource" target="_blank" rel="noreferrer">Open source</a>
        <div class="detail-actions">
          <button class="text-button" id="editFromDetailButton">Edit</button>
          <button class="text-button" id="planRecipeButton">Plan</button>
          <button class="text-button primary" id="shareRecipeButton">Copy this recipe</button>
        </div>
      </div>
    </article>
  </dialog>

  <dialog id="planRecipeDialog">
    <form method="dialog" class="editor" id="planRecipeForm">
      <div class="dialog-head">
        <h2>Add to Mealplanner</h2>
        <button type="button" class="icon-button" id="closePlanRecipeButton" aria-label="Close">X</button>
      </div>
      <p class="form-message" id="planRecipeName"></p>
      <label>Day<select id="planDaySelect"></select></label>
      <p class="form-message plan-day-preview" id="planDayPreview"></p>
      <label>Servings<input id="planServingsInput" type="number" min="1" inputmode="numeric"></label>
      <menu>
        <button type="button" class="text-button" id="cancelPlanRecipeButton">Cancel</button>
        <button class="text-button primary" id="savePlanRecipeButton" value="default">Add</button>
      </menu>
    </form>
  </dialog>

  <dialog id="importCodeDialog">
    <form method="dialog" class="editor" id="importCodeForm">
      <div class="dialog-head">
        <h2>Import recipe code</h2>
        <button type="button" class="icon-button" id="closeImportCodeButton" aria-label="Close">X</button>
      </div>
      <label>RM1 code<textarea id="recipeCodeInput" rows="9" placeholder="RM1-BEGIN:...:RM1-END"></textarea></label>
      <p class="form-message" id="recipeCodeMessage"></p>
      <menu>
        <button type="button" class="text-button" id="cancelImportCodeButton">Cancel</button>
        <button class="text-button primary" id="importCodeSubmitButton" value="default">Import</button>
      </menu>
    </form>
  </dialog>

  <template id="recipeCardTemplate">
    <button class="recipe-card">
      <span class="card-copy">
        <strong></strong>
        <small></small>
        <span class="mini-tags"></span>
      </span>
      <span class="favorite-mark"></span>
    </button>
  </template>

  <template id="mealPlanDayTemplate">
    <article class="meal-day">
      <div class="meal-day-head">
        <button class="meal-toggle-button" type="button">
          <span class="meal-day-name"></span>
          <span class="meal-day-summary"></span>
        </button>
        <button class="text-button meal-clear-button" type="button">Clear</button>
      </div>
      <div class="meal-day-body">
        <label>Recipe<select class="meal-recipe-select"></select></label>
        <label class="servings-label">Servings<input class="meal-servings-input" type="number" min="1" inputmode="numeric"></label>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
